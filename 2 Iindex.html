
<!DOCTYPE html>
<html>
<head>
    <title>TechFest</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: lightblue;
        }
        .card {
            background: white;
            margin: 15px;
            padding: 15px;
            border-radius: 10px;
        }
        button {
            background: blue;
            color: white;
            padding: 10px;
        }
    </style>
</head>
<body>

    <h1>🚀 NRI TechFest 2026</h1>
    <p>Learn, Innovate, Connect!</p>

    <div class="card">
        <h2>🎯 Theme</h2>
        <p>Artificial Intelligence</p>
    </div>

    <div class="card">
        <h2>🎤 Speakers</h2>
        <p>sushma - AI Expert</p>
        <p>bhavani - Developer</p>
    </div>

    <div class="card">
        <h2>📅 Schedule</h2>
        <p>10 AM - Speech</p>
        <p>11 AM - Workshop</p>
    </div>

    <div class="card">
        <h2>📍 Venue</h2>
        <p>College Auditorium</p>
    </div>

    <div class="card">
        <h2>📝 Register</h2>
        <input placeholder="Your Name">
        <br><br>
        <button onclick="alert('Registration successful!')">
            Register
        </button>
    </div>

</body>
</html>
