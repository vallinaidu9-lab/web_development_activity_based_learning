
<!DOCTYPE html>
<html>
<head>
    <title>Healthy Food</title>
    <style>
        body {
            font-family: Arial;
            background: #e8f5e9;
            text-align: center;
        }

        h1 {
            color: green;
        }

        .card {
            background: rgb(255, 255, 255);
            margin: 20px auto;
            padding: 15px;
            width: 250px;
            border-radius: 10px;
        }

        button {
            background: green;
            color: white;
            padding: 10px;
            border: none;
        }
    </style>
</head>

<body>

    <h1>Healthy Food 🥗</h1>
    <p>Eat Healthy, Stay Healthy!</p>

    <div class="card">
        <h2>🥗 Vegetable Salad</h2>
        <p>Ingredients: Tomato, Cucumber, Carrot</p>
        <p>Calories: 150 kcal</p>
        <button onclick="alert('Eat fresh vegetables!')">
            Healthy Tip
        </button>
    </div>

    <div class="card">
        <h2>🍎 Fruit Bowl</h2>
        <p>Ingredients: Apple, Banana, Grapes</p>
        <p>Calories: 200 kcal</p>
    </div>

    <div class="card">
        <h2>🥣 Oats</h2>
        <p>Ingredients: Oats, Milk, Banana</p>
        <p>Calories: 250 kcal</p>
    </div>

</body>
</html>
